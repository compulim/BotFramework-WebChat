  build:
    environment:
      deployment: false
      name: azure-devops
    name: Build
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      version-type: ${{ steps.get-version.outputs.version-type }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-slim
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - id: get-branch-name
        name: Get branch name
        run: |
          BRANCH_NAME=$(git symbolic-ref --short HEAD 2>/dev/null || git rev-parse --short HEAD)

          echo branch-name=$BRANCH_NAME | tee --append $GITHUB_OUTPUT

      - id: azdo-build
        if: '!inputs.local-build'
        name: Build (Azure DevOps)
        timeout-minutes: 45
        uses: ./.github/actions/azdo-build
        with:
          azdo-org: ${{ vars.AZDO_ORG }}
          azdo-pipeline-name: ${{ vars.AZDO_PIPELINE_NAME }}
          azdo-project: ${{ vars.AZDO_PROJECT }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          pipeline-variable: |
            ProjectBranch=${{ steps.get-branch-name.outputs.branch-name }}
            ProjectRepository=${{ github.repository }}

      - id: local-build
        if: inputs.local-build
        name: Build (local)
        uses: ./.github/actions/local-build

      - id: get-version
        name: Get version
        run: |
          echo version=${{ case(inputs.local-build, steps.local-build.outputs.version, steps.azdo-build.outputs.version) }} | tee --append $GITHUB_OUTPUT
          echo version-type=${{ case(inputs.local-build, steps.local-build.outputs.version-type, steps.azdo-build.outputs.version-type) }} | tee --append $GITHUB_OUTPUT

