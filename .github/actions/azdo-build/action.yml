name: 'Build via AzDO'
description: Run a build pipeline via Azure DevOps and download the build artifact

inputs:
  artifact-name:
    description: Output artifact name
    default: azdo-artifact
    type: string

  azdo-org:
    description: AzDO org URL
    required: true
    type: string

  azdo-pipeline-name:
    description: AzDO pipeline name
    required: true
    type: string

  azdo-project:
    description: AzDO project name
    required: true
    type: string

  azure-client-id:
    description: Azure client ID
    required: true
    type: string

  azure-subscription-id:
    description: Azure subscription ID
    required: true
    type: string

  azure-tenant-id:
    description: Azure tenant ID
    required: true
    type: string

  branch-name:
    description: Branch name
    default: main
    type: string

  download-artifact-name:
    description: Name of AzDO artifact to download
    required: true
    type: string

  pipeline-variable:
    description: Pipeline variable
    required: true
    type: string

  # dist-tag:
  #   description: Dist-tag
  #   default: main
  #   type: string

  # version:
  #   description: Version
  #   required: true
  #   type: string

outputs:
  version:
    description: Version
    value: ${{ steps.get-version.outputs.version }}

  version-type:
    description: Version
    value: ${{ steps.get-version.outputs.version-type }}

runs:
  using: composite
  steps:
    - name: Install Azure CLI
      run: |
        if ! command -v az > /dev/null; then
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
        fi

        if ! command -v jq > /dev/null; then
          sudo apt-get update
          # sudo apt-get install -y icu jq
          sudo apt-get install -y jq
        fi
      shell: bash

    # - name: Azure login
    #   run: |
    #     # az login \
    #     #   --client-id ${{ inputs.azure-client-id }} \
    #     #   --federated-token ${{ github.token }} \
    #     #   --identity \
    #     #   --subscription ${{ inputs.azure-subscription-id }} \
    #     #   --tenant ${{ inputs.azure-tenant-id }}

    #     az login \
    #       --allow-no-subscription \
    #       --federated-token ${{ github.token }} \
    #       --service-principal \
    #       --tenant ${{ inputs.azure-tenant-id }} \
    #       --username ${{ inputs.azure-client-id }}
    #   shell: bash

    - uses: azure/login@v2
      with:
        allow-no-subscriptions: true
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}

    - id: run-pipeline
      run: |
        set -e -o pipefail

        az extension add --name azure-devops --only-show-errors
        # az pipelines list --org ${{ inputs.azdo-org }} --project ${{ inputs.azdo-project }}
        OUTPUT=$(
          az pipelines run \
            --detect false --output json) \
            --name ${{ inputs.azdo-pipeline-name }} \
            --org ${{ inputs.azdo-org }} \
            --project ${{ inputs.azdo-project }} \
            --variable ${{ inputs.pipeline-variable }}
        )

        RUN_ID=$(echo "$OUTPUT" | jq -r '.id')
        RUN_URL=$(echo "$OUTPUT" | jq -r '.url')

        if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
          echo "$OUTPUT"
          echo "Failed to extract run ID from output"
          exit 1
        fi

        if [ -z "$RUN_URL" ] || [ "$RUN_URL" = "null" ]; then
          echo "$OUTPUT"
          echo "Failed to extract run URL from output"
          exit 1
        fi

        echo "run-id=$RUN_ID" | tee --append $GITHUB_OUTPUT
        echo "url=$RUN_URL" | tee --append $GITHUB_OUTPUT
      shell: bash

    # Temporarily not running pipeline but getting from existing result
    # - id: run-pipeline
    #   name: Run pipeline
    #   run: |
    #     echo run-id=424951 | tee --append $GITHUB_OUTPUT
    #     echo url=https://fuselabs.visualstudio.com/531382a8-71ae-46c8-99eb-9512ccb91a43/_apis/build/Builds/424951 | tee --append $GITHUB_OUTPUT
    #   shell: bash

    - name: Wait for pipeline completion
      run: |
        set -e -o pipefail

        az extension add --name azure-devops --only-show-errors

        RUN_ID="${{ steps.run-pipeline.outputs.run-id }}"
        echo "Waiting for run ID: $RUN_ID to complete..."

        # Timeout after 45 minutes (2700 seconds)
        TIMEOUT=2700
        ELAPSED=0
        INTERVAL=5

        while [ $ELAPSED -lt $TIMEOUT ]; do
          OUTPUT=$(
            az pipelines runs show \
              --id "$RUN_ID" \
              --org ${{ inputs.azdo-org }} \
              --project ${{ inputs.azdo-project }} \
              --detect false \
              --output json
          )
          STATUS=$(echo "$OUTPUT" | jq -r '.status')

          if [ -z "$STATUS" ] || [ "$STATUS" = "null" ]; then
            echo "Failed to extract status from output"
            exit 1
          fi

          echo "Current status: $STATUS (elapsed: ${ELAPSED}s)"

          # Check for terminal states
          if [ "$STATUS" = "completed" ]; then
            echo "Pipeline completed!"
            RESULT=$(echo "$OUTPUT" | jq -r '.result')
            echo "Result: $RESULT"

            if [ "$RESULT" != "succeeded" ]; then
              echo "Pipeline failed with result: $RESULT"
              exit 1
            fi

            echo "Pipeline succeeded!"
            exit 0
          elif [ "$STATUS" = "canceling" ] || [ "$STATUS" = "canceled" ]; then
            echo "Pipeline was canceled"
            exit 1
          fi

          sleep $INTERVAL
          ELAPSED=$((ELAPSED + INTERVAL))
        done

        echo "Timeout reached after ${TIMEOUT} seconds for run ID: $RUN_ID"
        exit 1
      shell: bash

    - name: Download artifact from Azure DevOps
      run: |
        set -e -o pipefail

        az extension add --name azure-devops --only-show-errors

        RUN_ID="${{ steps.run-pipeline.outputs.run-id }}"
        echo "Downloading artifact 'drop_build_main' from run ID: $RUN_ID"

        # Create directory for artifact
        mkdir -p ./artifact-download/

        # Download the artifact
        az pipelines runs artifact download \
          --artifact-name "drop_build_main" \
          --detect false \
          --org ${{ inputs.azdo-org }} \
          --path "$GITHUB_WORKSPACE/artifact-download/" \
          --project ${{ inputs.azdo-project }} \
          --run-id "$RUN_ID"

        # Verify artifact was downloaded
        if [ -z "$(ls -A artifact-download)" ]; then
          echo "Artifact directory is empty after download"
          exit 1
        fi

        echo "Artifact downloaded successfully"
      shell: bash

    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.artifact-name }}
        path: ./artifact-download/

    - id: get-version
      name: Get version
      run: |
        VERSION=$(tar -xzOf botframework-webchat-core-*.tgz package/package.json | jq -r '.version')

        echo version=$VERSION | tee --append $GITHUB_OUTPUT

        if [[ "$VERSION" == *-0 ]]; then echo version-type=prerelease | tee --append $GITHUB_OUTPUT; else echo version-type=production | tee --append $GITHUB_OUTPUT; fi
      shell: bash
      working-directory: ./artifact-download/tgzfiles

